name: 投稿一个车牌号
description: 推荐一部值得一看的作品。只填元数据，不要放任何资源链接。
title: "[投稿] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        提交后机器人会自动校验、入库并关闭本 Issue，几秒后站点就能搜到。
        **如果提示失败，直接编辑本 Issue 内容即可自动重试，不用重开一个。**

        > ⚠️ 严禁填写任何下载链接、磁力、种子、网盘地址。填写会被直接拒绝。

  - type: input
    id: code
    attributes:
      label: 车牌号
      description: 按作品实际编号填写，大小写不敏感
      placeholder: "SSIS-123 / FC2-PPV-1234567"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: 作品标题
      description: 不确定可以留空，站点靠番号也能搜到
      placeholder: 选填
    validations:
      required: false

  - type: input
    id: actors
    attributes:
      label: 演员
      description: 多个用英文逗号分隔
      placeholder: "演员甲, 演员乙"
    validations:
      required: false

  - type: input
    id: tags
    attributes:
      label: 标签
      description: 多个用英文逗号分隔，优先复用首页已有的标签
      placeholder: "剧情, 悬疑, 长镜头"
    validations:
      required: false

  - type: input
    id: studio
    attributes:
      label: 厂牌
      placeholder: 选填
    validations:
      required: false

  - type: input
    id: releaseDate
    attributes:
      label: 发行日期
      description: 格式 2024-03-01，不确定就留空
      placeholder: "2024-03-01"
    validations:
      required: false

  - type: input
    id: score
    attributes:
      label: 评分
      description: 0 到 10 之间，可以带一位小数
      placeholder: "8.5"
    validations:
      required: false

  - type: textarea
    id: reason
    attributes:
      label: 推荐理由
      description: |
        4 到 200 字。写清楚「为什么值得看」，而不是「很好看」。
        好的例子：剧本完整，前四十分钟铺垫后反转，反派演技在线。
      placeholder: 一句话说清楚它的独特之处
    validations:
      required: true

  - type: input
    id: sourceUrl
    attributes:
      label: 来源链接
      description: 仅限官方发行页或正规数据库条目页
      placeholder: 选填
    validations:
      required: false

  - type: checkboxes
    id: ack
    attributes:
      label: 提交前确认
      options:
        - label: 我确认内容中不含任何资源链接、网盘、磁力或下载地址
          required: true
        - label: 我确认推荐理由是本人原创，不是复制的宣传文案
          required: false
